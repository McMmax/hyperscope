[package]
name = "hyperscope-schema"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hyperscope SpacetimeDB table schema — the live full-stack telemetry contract."
repository = "https://github.com/mearz/Hyperscope"

[dependencies]
# Must match the host module's SpacetimeDB version exactly — the #[table] macro
# emits version-specific descriptors that the module links into its WASM binary.
spacetimedb = "=2.8.2"
