plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.5'
    id 'net.kyori.blossom' version '2.2.0'
    id 'maven-publish'
}


if (project.plugins.hasPlugin('dev.yumi.gradle.licenser')) {
    license {
        exclude '**/sampler/async/jfr/**'
        exclude {
            it.file.toString().startsWith(buildDir.toString())
        }
    }
}

dependencies {
    if (findProject(':hyperscope-api') != null) {
        api project(':hyperscope-api')
    } else {
        api project(':spark-api')
    }
    implementation 'tools.profiler:async-profiler:4.5' // spark native version: 11aaea3 (v4.5)
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'net.bytebuddy:byte-buddy-agent:1.14.17'
    implementation 'com.google.protobuf:protobuf-javalite:4.31.1'

    implementation('me.lucko:bytesocks-java-client:1.0-SNAPSHOT') {
        exclude(module: 'slf4j-api')
    }

    api('net.kyori:adventure-api:5.1.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'checker-qual')
        exclude(module: 'annotations')
    }
    api('net.kyori:adventure-text-serializer-gson:5.1.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'adventure-api')
        exclude(module: 'gson')
    }
    api('net.kyori:adventure-text-serializer-legacy:5.1.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'adventure-api')
    }
    implementation('net.kyori:adventure-text-feature-pagination:4.0.0-SNAPSHOT') {
        exclude(module: 'adventure-api')
    }
    compileOnly 'com.google.code.gson:gson:2.7'
    compileOnly 'com.google.guava:guava:19.0'
    compileOnly 'org.jspecify:jspecify:1.0.0'

    // test
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'com.google.code.gson:gson:2.7'
    testImplementation 'com.google.guava:guava:19.0'
    testImplementation 'org.jspecify:jspecify:1.0.0'

    testImplementation('net.kyori:adventure-text-serializer-ansi:5.1.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'adventure-api')
    }
}

protobuf {
    protoc {
        def os = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT)
        def arch = System.getProperty('os.arch').toLowerCase(java.util.Locale.ROOT)
        def classifier = os.contains('win') ? 'windows-x86_64' :
                os.contains('mac') ? (arch.contains('aarch64') ? 'osx-aarch_64' : 'osx-x86_64') :
                        (arch.contains('aarch64') ? 'linux-aarch_64' : 'linux-x86_64')
        artifact = "com.google.protobuf:protoc:4.31.1:${classifier}@exe"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

sourceSets {
    main {
        blossom {
            javaSources {
                property 'version', project.hasProperty('pluginVersion') ? project.pluginVersion : '1.10.0'
                property 'description', project.hasProperty('pluginDescription') ? project.pluginDescription : 'spark'
            }
        }
    }
}

test {
    useJUnitPlatform {}
    systemProperty('net.kyori.ansi.colorLevel', 'indexed16')
}

publishing {
    //repositories {
    //    maven {
    //        url = 'https://nexus.lucko.me/repository/maven-snapshots/'
    //        credentials {
    //            username = luckoNexusUsername
    //            password = luckoNexusPassword
    //        }
    //    }
    //}
    publications {
        maven(MavenPublication) {
            from components.java
            version = "${project.hasProperty('pluginVersion') ? project.pluginVersion : '1.10.0'}-SNAPSHOT"
        }
    }
}
